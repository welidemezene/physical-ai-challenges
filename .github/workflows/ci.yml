name: CI

# Compile-check the daily scripts on every push and PR so a syntactically
# broken commit is caught before it lands on main. Kept dependency-free: this
# validates that the code parses, which is the cheap, reliable signal — it does
# not import torch or run training.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all Python files
        # -q keeps the log quiet on success; a syntax error fails the job.
        run: python -m compileall -q .
